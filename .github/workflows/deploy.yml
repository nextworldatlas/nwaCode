name: Build and deploy to nextworldatlas.com

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys write to public_html at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SSH_HOST: 62.72.50.247
  SSH_PORT: 65002
  SSH_USER: u857656583
  REMOTE_ROOT: public_html

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # A build without the token compiles fine and deploys a blank map,
      # so fail here instead of shipping it.
      - name: Check Mapbox token is present
        env:
          REACT_APP_MAPBOX_KEY: ${{ secrets.REACT_APP_MAPBOX_KEY }}
        run: |
          if [ -z "$REACT_APP_MAPBOX_KEY" ]; then
            echo "::error::REACT_APP_MAPBOX_KEY secret is empty. Set it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - run: npm ci

      - name: Build
        env:
          REACT_APP_MAPBOX_KEY: ${{ secrets.REACT_APP_MAPBOX_KEY }}
          CI: false # eslint warnings are not build failures
        run: npm run build

      # Guard against the bundle silently losing its assets or its token.
      - name: Verify build output
        run: |
          bundle=$(ls build/static/js/main.*.js)
          grep -q 'pk\.ey' "$bundle" || { echo "::error::No Mapbox token in bundle"; exit 1; }
          ! grep -q 'raw\.githubusercontent' "$bundle" || { echo "::error::Bundle still references raw.githubusercontent"; exit 1; }
          test -f build/data/world_1.geojson
          test -f build/markers/Rome.png
          test -f build/markersgrey/Ottoman.png
          echo "build OK: $(du -sh build | cut -f1)"

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # public_html is shared: airportrouteatlas/, bookings/ and guesspolis/
      # are OTHER sites that live inside it. A blanket --delete here would
      # destroy them. So root-level files sync WITHOUT --delete, and --delete
      # is scoped to the four directories this app actually owns.
      - name: Deploy root files (no delete)
        run: |
          rsync -rlvz --no-perms --no-times \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            --exclude 'static/' --exclude 'data/' --exclude 'markers/' --exclude 'markersgrey/' \
            build/ "$SSH_USER@$SSH_HOST:$REMOTE_ROOT/"

      - name: Deploy owned directories (delete stale files)
        run: |
          for dir in static data markers markersgrey; do
            echo "--- syncing $dir ---"
            rsync -rlvz --delete --no-perms --no-times \
              -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
              "build/$dir/" "$SSH_USER@$SSH_HOST:$REMOTE_ROOT/$dir/"
          done

      - name: Confirm sibling sites are intact
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'for d in airportrouteatlas bookings guesspolis; do
               if [ -d "$HOME/'"$REMOTE_ROOT"'/$d" ]; then echo "ok: $d"; else echo "MISSING: $d"; exit 1; fi
             done'

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
